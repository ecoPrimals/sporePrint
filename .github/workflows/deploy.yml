# TRAILING SHADOW — Primary deployment is sovereign on golgiBody-ext (VPS).
# This GitHub Pages deploy continues as the extracellular mirror until
# DNS registrar NS cutover is complete. After cutover, this workflow
# can be archived to fossilRecord.
name: Deploy to GitHub Pages (trailing shadow)

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zola
        run: |
          curl -sL https://github.com/getzola/zola/releases/download/v0.22.1/zola-v0.22.1-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv zola /usr/local/bin/
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            crates/spore-validate/target
          key: spore-validate-${{ hashFiles('crates/spore-validate/Cargo.lock') }}
      - name: Validate entity registry
        run: |
          cargo build --release --manifest-path crates/spore-validate/Cargo.toml
          ./crates/spore-validate/target/release/spore-validate --root . validate --check
      - name: Check links (external — non-blocking)
        continue-on-error: true
        run: zola check

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with Zola
        uses: shalzz/zola-deploy-action@v0.22.1
        env:
          BUILD_ONLY: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CDN propagation
        run: sleep 30

      - name: Verify site is live
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://primals.eco/)
          echo "primals.eco returned HTTP $STATUS"
          if [[ "$STATUS" != "200" ]]; then
            echo "::warning::primals.eco returned $STATUS — CDN may still be propagating"
          fi

      - name: Verify key pages respond
        run: |
          FAILURES=0
          for path in "/" "/science/" "/architecture/" "/architecture/generational-arc/" "/lab/" "/lab/spores/" "/glossary/" "/primals/" "/springs/"; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://primals.eco${path}")
            if [[ "$STATUS" == "200" ]]; then
              echo "OK   $path ($STATUS)"
            else
              echo "FAIL $path ($STATUS)"
              FAILURES=$((FAILURES + 1))
            fi
          done
          if [[ $FAILURES -gt 0 ]]; then
            echo "::warning::$FAILURES page(s) returned non-200 — may need CDN propagation time"
          fi
          echo "Verified $(( 9 - FAILURES ))/9 pages"
