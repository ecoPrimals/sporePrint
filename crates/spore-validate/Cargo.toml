[package]
name = "spore-validate"
version = "0.3.1"
edition = "2024"
description = "Typed validation tooling for sporePrint — entity registry, content integrity, and metric sync"
license = "AGPL-3.0-or-later"
rust-version = "1.85"
repository = "https://github.com/ecoPrimals/sporePrint"
homepage = "https://primals.eco"
documentation = "https://primals.eco/architecture/ecosystem-architecture/"
authors = ["ecoPrimal <eco.primal@pm.me>"]
keywords = ["validation", "content", "integrity", "scientific-computing"]
categories = ["command-line-utilities", "science"]
readme = "README.md"

# Runtime dependencies (not crate deps):
#   git — required by `refresh` subcommand for upstream repo fetch (GitBackend)

[dependencies]
base64 = "0.22"
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }
clap = { version = "4", features = ["derive", "env"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
toml_edit = "0.22"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
ureq = "2"

[profile.release]
lto = true
strip = true
codegen-units = 1

[workspace]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
struct_field_names = "allow"
