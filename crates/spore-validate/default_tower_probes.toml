# G69 baseline: Tower Atomic P1 readiness probes.
# These are the stable P1 methods for core Tower primals.
# Override at runtime with `spore-validate tower-status --probes <file.toml>`.

[[probes]]
slug = "beardog"
methods = ["auth.public_key", "auth.trusted_issuers", "btsp.capabilities"]

[[probes]]
slug = "songbird"
methods = ["mesh.peers", "mesh.capabilities_announce", "mesh.init"]

[[probes]]
slug = "skunkbat"
methods = ["defense.status", "security.detect", "btsp.negotiate"]
