# sporePrint Source Registry
# =========================
#
# Maps each primal and spring to its source GitHub repository.
# Used by auto-refresh.yml to clone repos and update metrics in config.toml.
#
# This mirrors plasmidBin's sources.toml but covers springs as well.
# plasmidBin distributes binaries; sporePrint displays metrics and content.
#
# Org layout:
#   ecoPrimals/          — Primals + infra (public, except bearDog + skunkBat)
#   syntheticChemistry/  — Springs (science validation, private)
#   sporeGarden/         — Products (gen4 consumers, public)
#
# Updated: 2026-05-06

# =============================================================================
# PRIMALS — Tower Atomic (trust boundary)
# =============================================================================

[sources.beardog]
repo = "ecoPrimals/bearDog"
type = "primal"
private = true

[sources.songbird]
repo = "ecoPrimals/songBird"
type = "primal"

