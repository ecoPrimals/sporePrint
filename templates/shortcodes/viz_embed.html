{% set viz_name = src | split(pat="?") | first | split(pat="/") | last %}
{% set static_path = "/viz/" ~ viz_name ~ ".svg" %}
<div class="viz-embed" data-viz-src="{{ src }}">
  <img src="{{ static_path }}" alt="Visualization: {{ viz_name }}" loading="lazy" />
  <noscript>Visualization: <a href="{{ src }}">{{ src }}</a></noscript>
</div>
